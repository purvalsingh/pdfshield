name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Smoke-test the CLI
        run: pdfshield --version && pdfshield scan --help
      - name: Evaluate the bundled model (quick run)
        run: pdfshield evaluate --n 100 --stress-n 10

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pdfshield .
      - name: Scan in a locked-down container
        run: |
          docker run --rm --network none --read-only --cap-drop ALL pdfshield --version
